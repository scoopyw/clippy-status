<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clippy Status</title>
<meta name="description" content="Is clippy.gg up? Live status of the Clippy website, app API, sign-in, updates and clip playback, checked every five minutes." />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<meta name="theme-color" content="#14121c" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f7f6fb" media="(prefers-color-scheme: light)" />
<meta property="og:title" content="Clippy Status" />
<meta property="og:description" content="Live status of clippy.gg, the Clippy app's services and clip playback." />
<meta property="og:url" content="https://status.clippy.gg/" />
<style>
  /* The look follows clippy.gg (V3, 2026-11-19). Colours are the brand kit's
     tokens.json, the wordmark is the kit's clippy-logo-horizontal, both from
     https://clippy.gg/clippy-brand-kit/ (kit 2026.11.20). The brand is decided
     there, not here: when it changes, copy it over again. */
  :root {
    color-scheme: dark;
    --bg: #14121c;
    --surface: #1a1723;
    --surface-2: #211e2c;
    --border: #2a263b;
    --border-2: #37324b;
    --fg: #f2f0f9;
    --muted: #a8a3bd;
    --subtle: #8e89a4;
    --violet: #7c5de5;
    --link: #a58fff;
    --logo: #ffffff;
    --logo-eye: #a58fff;
    --glow: rgba(124, 93, 229, .2);
    --up: #6ee7b7;
    --up-bar: #34d399;
    --up-soft: #10281f;
    --up-border: #1f4d38;
    --slow: #fcd34d;
    --slow-bar: #f5b83d;
    --slow-soft: #2b2210;
    --slow-border: #5a4614;
    --down: #fda4af;
    --down-bar: #f87171;
    --down-soft: #2b1418;
    --down-border: #5c2229;
    --none-bar: #2a263b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f7f6fb;
      --surface: #ffffff;
      --surface-2: #f4f2fd;
      --border: #e3dff0;
      --border-2: #d5caf6;
      --fg: #14121c;
      --muted: #5c5770;
      --subtle: #6f6a84;
      --violet: #7c5de5;
      --link: #5a37cd;
      --logo: #14121c;
      --logo-eye: #7c5de5;
      --glow: rgba(124, 93, 229, .13);
      --up: #047857;
      --up-bar: #10b981;
      --up-soft: #ecfdf5;
      --up-border: #a7f3d0;
      --slow: #92400e;
      --slow-bar: #f59e0b;
      --slow-soft: #fffbeb;
      --slow-border: #fde68a;
      --down: #b91c1c;
      --down-bar: #ef4444;
      --down-soft: #fef2f2;
      --down-border: #fecaca;
      --none-bar: #e3dff0;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    background: radial-gradient(60% 100% at 50% 0, var(--glow), transparent 72%) no-repeat top / 100% 380px, var(--bg);
    color: var(--fg);
    font: 400 16px/1.5 Outfit, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 6px; }
  .wrap { width: 100%; max-width: 852px; margin: 0 auto; padding: 0 16px; }
  main { flex: 1; }

  /* The site's own bar: wordmark in the middle, a link on each side. */
  .nav .wrap { max-width: 1304px; padding: 0 32px; height: 68px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .nav .here { font-weight: 600; font-size: 15px; color: var(--link); }
  .nav .logo { display: block; line-height: 0; }
  .nav .logo svg { display: block; height: 32px; width: auto; }
  .nav .logo .w { fill: var(--logo); }
  .nav .logo .e { fill: var(--logo-eye); }
  .nav .out { justify-self: end; display: inline-flex; align-items: center; gap: 6px; padding: 8px 0; font-size: 15px; color: var(--fg); opacity: .72; transition: opacity .15s; }
  .nav .out:hover { opacity: 1; text-decoration: none; }
  .nav .out svg { width: 14px; height: 14px; flex: none; }

  .banner {
    display: flex; align-items: center; gap: 20px;
    margin-top: 28px; padding: 28px; border-radius: 16px;
    border: 1px solid var(--up-border); background: var(--up-soft);
  }
  .banner.slow { border-color: var(--slow-border); background: var(--slow-soft); }
  .banner.down { border-color: var(--down-border); background: var(--down-soft); }
  .banner.unknown { border-color: var(--border); background: var(--surface); }
  .banner h1 {
    font: 800 clamp(17px, 3.1vw, 25px)/1.1 Unbounded, Outfit, system-ui, sans-serif;
    text-transform: uppercase; letter-spacing: -.01em; overflow-wrap: anywhere;
  }
  .banner p { color: var(--muted); font-size: 15px; margin-top: 7px; }
  .orb { flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--up-bar); box-shadow: 0 0 0 6px color-mix(in srgb, var(--up-bar) 22%, transparent); }
  .slow .orb { background: var(--slow-bar); box-shadow: 0 0 0 6px color-mix(in srgb, var(--slow-bar) 22%, transparent); }
  .down .orb { background: var(--down-bar); box-shadow: 0 0 0 6px color-mix(in srgb, var(--down-bar) 22%, transparent); }
  .unknown .orb { background: var(--subtle); box-shadow: none; }

  section { margin-top: 40px; }
  h2 { font: 700 21px/1.2 Outfit, system-ui, sans-serif; letter-spacing: -.01em; margin-bottom: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
  .svc { padding: 20px 24px; }
  .svc + .svc { border-top: 1px solid var(--border); }
  .svc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .svc-name { font-weight: 600; line-height: 1.3; }
  .svc-about { color: var(--subtle); font-size: 14px; margin-top: 2px; }
  .pill { flex: none; display: inline-flex; align-items: center; height: 24px; padding: 0 10px; font: 600 12.5px/1 Outfit, system-ui, sans-serif; border-radius: 999px; color: var(--up); background: var(--up-soft); border: 1px solid var(--up-border); white-space: nowrap; }
  .pill.slow { color: var(--slow); background: var(--slow-soft); border-color: var(--slow-border); }
  .pill.down { color: var(--down); background: var(--down-soft); border-color: var(--down-border); }
  .pill.unknown { color: var(--muted); background: var(--surface-2); border-color: var(--border); }
  .bars { display: flex; gap: 2px; height: 30px; margin-top: 16px; }
  .bar { flex: 1; border-radius: 2px; background: var(--none-bar); min-width: 2px; cursor: default; outline: none; }
  .bar.up { background: var(--up-bar); }
  .bar.slow { background: var(--slow-bar); }
  .bar.down { background: var(--down-bar); }
  .bar:hover, .bar:focus-visible { filter: brightness(1.25); }
  .bar-foot { display: flex; justify-content: space-between; color: var(--subtle); font-size: 13px; margin-top: 7px; }
  .bar-foot b { color: var(--muted); font-weight: 600; }

  .incident { padding: 20px 24px; }
  .incident + .incident { border-top: 1px solid var(--border); }
  .incident-head { display: flex; justify-content: space-between; gap: 4px 12px; align-items: baseline; flex-wrap: wrap; }
  .incident-title { font-weight: 600; }
  .incident-title.ongoing { color: var(--down); }
  .incident-when { color: var(--subtle); font-size: 14px; }
  .incident p { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .empty { padding: 20px 24px; color: var(--muted); }

  footer { margin-top: 64px; border-top: 1px solid var(--border); color: var(--subtle); font-size: 14px; text-align: center; }
  footer .wrap { padding-top: 30px; padding-bottom: 38px; }
  footer p + p { margin-top: 4px; }

  #tip {
    position: fixed; z-index: 10; pointer-events: none; opacity: 0;
    background: var(--surface-2); border: 1px solid var(--border-2); color: var(--fg);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; line-height: 1.4;
    box-shadow: 0 10px 24px -12px rgba(0,0,0,.5); transition: opacity .1s;
    max-width: 220px;
  }
  #tip b { display: block; font-weight: 600; }
  #tip span { color: var(--muted); }

  @media (max-width: 560px) {
    .nav .wrap { padding: 0 16px; gap: 10px; }
    .banner { margin-top: 16px; padding: 20px 18px; gap: 16px; }
    section { margin-top: 32px; }
    h2 { font-size: 19px; }
    .svc, .incident, .empty { padding: 16px; }
    .bars { height: 26px; }
    footer { margin-top: 48px; }
  }
  @media (max-width: 360px) {
    .nav .logo svg { height: 26px; }
    .nav .here, .nav .out { font-size: 14px; }
  }
</style>

<script>
(function () {
  // Live data comes straight from the repository, so the page never needs a
  // redeploy to show a new check. Served from anywhere else (a local preview),
  // it reads the files next to it.
  var REPO_RAW = 'https://raw.githubusercontent.com/scoopyw/clippy-status/main/';
  var BASE = /github\.io$|status\.clippy\.gg$/.test(location.hostname) ? REPO_RAW : '../';
  var STALE_MIN = 20;

  var LABEL = { up: 'Working', slow: 'Slow', down: 'Down', unknown: 'No data' };

  function get(p) {
    return fetch(BASE + p + '?t=' + Math.floor(Date.now() / 60000), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function ago(iso) {
    var m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60);
    if (h < 48) return h + ' h ago';
    return Math.round(h / 24) + ' days ago';
  }
  function dur(a, b) {
    var m = Math.max(1, Math.round((Date.parse(b) - Date.parse(a)) / 60000));
    if (m < 60) return m + ' min';
    var h = Math.floor(m / 60), r = m % 60;
    return h + ' h' + (r ? ' ' + r + ' min' : '');
  }
  function day(iso) {
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function time(iso) {
    return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }
  function pct(n) {
    if (n >= 99.995) return '100%';
    return (Math.floor(n * 100) / 100).toFixed(2) + '%';
  }
  function isoDay(d) { return d.toISOString().slice(0, 10); }

  var tip = document.getElementById('tip');
  function showTip(target, html) {
    tip.innerHTML = html;
    var r = target.getBoundingClientRect();
    tip.style.opacity = '1';
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
    var y = r.top - h - 8;
    if (y < 8) y = r.bottom + 8;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }
  function hideTip() { tip.style.opacity = '0'; }

  var state = null;

  function render() {
    if (!state) return;
    var services = state.services, current = state.current, history = state.history, incidents = state.incidents;
    var byId = {};
    (current.services || []).forEach(function (s) { byId[s.id] = s; });
    var stale = !current.checkedAt || (Date.now() - Date.parse(current.checkedAt)) / 60000 > STALE_MIN;

    // Banner
    var downs = services.filter(function (s) { return byId[s.id] && byId[s.id].status === 'down'; });
    var slows = services.filter(function (s) { return byId[s.id] && byId[s.id].status === 'slow'; });
    var banner = document.getElementById('banner');
    var title = document.getElementById('banner-title');
    var sub = document.getElementById('banner-sub');
    var kind = downs.length ? 'down' : slows.length ? 'slow' : 'up';
    if (downs.length === services.length) title.textContent = 'Clippy is down. We are on it.';
    else if (downs.length) title.textContent = downs.map(function (s) { return s.name; }).join(', ') + (downs.length === 1 ? ' is down' : ' are down');
    else if (slows.length) title.textContent = slows.map(function (s) { return s.name; }).join(', ') + (slows.length === 1 ? ' is slow right now' : ' are slow right now');
    else title.textContent = 'Everything is working';
    sub.textContent = current.checkedAt
      ? (stale ? 'The checks are running late. Last check ' + ago(current.checkedAt) + '.' : 'Last checked ' + ago(current.checkedAt) + '.')
      : 'No checks yet.';
    if (!current.checkedAt) kind = 'unknown';
    banner.className = 'banner ' + kind;

    // Services, grouped
    var days = innerWidth < 560 ? 30 : 90;
    var today = new Date();
    var list = [];
    for (var i = days - 1; i >= 0; i--) list.push(isoDay(new Date(today.getTime() - i * 86400000)));

    var groups = document.getElementById('groups');
    groups.textContent = '';
    var order = [];
    services.forEach(function (s) { if (order.indexOf(s.group) < 0) order.push(s.group); });
    order.forEach(function (g) {
      var sec = el('section');
      sec.appendChild(el('h2', null, g));
      var card = el('div', 'card');
      services.filter(function (s) { return s.group === g; }).forEach(function (s) {
        var cur = byId[s.id];
        var status = cur ? cur.status : 'unknown';
        var row = el('div', 'svc');
        var head = el('div', 'svc-head');
        var left = el('div');
        left.appendChild(el('div', 'svc-name', s.name));
        left.appendChild(el('div', 'svc-about', s.about));
        head.appendChild(left);
        var pill = el('span', 'pill ' + status, LABEL[status]);
        if (cur && status === 'down' && cur.since) pill.title = 'Since ' + time(cur.since) + (cur.why ? ' (' + cur.why + ')' : '');
        head.appendChild(pill);
        row.appendChild(head);

        var h = history[s.id] || {};
        var bars = el('div', 'bars');
        var total = 0, up = 0;
        list.forEach(function (d) {
          var b = h[d];
          var bar = el('span', 'bar');
          bar.tabIndex = 0;
          var html;
          if (b && b.total) {
            total += b.total; up += b.up;
            var p = 100 * b.up / b.total;
            bar.className = 'bar ' + (p >= 99.5 ? 'up' : p >= 95 ? 'slow' : 'down');
            var avg = b.up ? Math.round(b.ms / b.up) : null;
            html = '<b>' + day(d) + '</b><span>' + pct(p) + ' up' + (avg ? ', ' + avg + ' ms on average' : '') + '</span>';
          } else {
            html = '<b>' + day(d) + '</b><span>No checks this day</span>';
          }
          bar.setAttribute('aria-label', html.replace(/<[^>]+>/g, ' ').trim());
          bar.addEventListener('mouseenter', function () { showTip(bar, html); });
          bar.addEventListener('focus', function () { showTip(bar, html); });
          bar.addEventListener('mouseleave', hideTip);
          bar.addEventListener('blur', hideTip);
          bars.appendChild(bar);
        });
        row.appendChild(bars);
        var foot = el('div', 'bar-foot');
        foot.appendChild(el('span', null, days + ' days ago'));
        var mid = el('span');
        if (total) { var bb = el('b', null, pct(100 * up / total)); mid.appendChild(bb); mid.appendChild(document.createTextNode(' up')); }
        else mid.textContent = 'Not enough checks yet';
        foot.appendChild(mid);
        foot.appendChild(el('span', null, 'Today'));
        row.appendChild(foot);
        card.appendChild(row);
      });
      sec.appendChild(card);
      groups.appendChild(sec);
    });

    // Incidents, newest first, last 30 days plus anything still open
    var names = {};
    services.forEach(function (s) { names[s.id] = s.name; });
    var since = Date.now() - 30 * 86400000;
    var shown = incidents.filter(function (x) { return !x.end || Date.parse(x.start) > since; })
      .sort(function (a, b) { return Date.parse(b.start) - Date.parse(a.start); });
    var box = document.getElementById('incidents');
    box.textContent = '';
    if (!shown.length) { box.appendChild(el('div', 'empty', 'No incidents in the last 30 days.')); return; }
    shown.forEach(function (x) {
      var row = el('div', 'incident');
      var head = el('div', 'incident-head');
      var t = x.title || ((names[x.service] || x.service) + (x.end ? ' was down' : ' is down'));
      head.appendChild(el('div', 'incident-title' + (x.end ? '' : ' ongoing'), t));
      head.appendChild(el('div', 'incident-when',
        day(x.start) + ', ' + time(x.start) + (x.end ? ' to ' + time(x.end) + ' (' + dur(x.start, x.end) + ')' : ', ongoing for ' + dur(x.start, new Date().toISOString()))));
      row.appendChild(head);
      var note = x.note || (x.why ? 'Reason seen from outside: ' + x.why + '.' : '');
      if (note) row.appendChild(el('p', null, note));
      box.appendChild(row);
    });
  }

  function load() {
    Promise.all([get('services.json'), get('data/current.json'), get('data/history.json'), get('data/incidents.json')])
      .then(function (r) {
        state = { services: r[0], current: r[1], history: r[2], incidents: r[3] };
        render();
      })
      .catch(function () {
        if (state) return;
        document.getElementById('banner-title').textContent = 'Could not load the status';
        document.getElementById('banner-sub').textContent = 'Try again in a minute.';
        document.getElementById('incidents').innerHTML = '<div class="empty">Not available right now.</div>';
      });
  }

  load();
  setInterval(load, 60000);
  var last = innerWidth < 560;
  addEventListener('resize', function () { var n = innerWidth < 560; if (n !== last) { last = n; render(); } });
})();
</script>
</body>
</html>
